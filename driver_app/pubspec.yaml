name: driver_app
description: Elimmekatruck — Application chauffeur
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Stockage sécurisé (JWT)
  flutter_secure_storage: ^9.2.2

  # GPS
  geolocator: ^13.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Foreground service GPS (process keepalive + notification bandeau Android)
  flutter_foreground_task: ^8.15.0

  # Carte (OpenStreetMap — gratuit, pas de clé API)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # WebSocket
  web_socket_channel: ^3.0.1

  # Push notifications
  onesignal_flutter: ^5.2.5

  # Cache local offline
  shared_preferences: ^2.3.3

  # Models immutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
