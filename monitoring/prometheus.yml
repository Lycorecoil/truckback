global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:3000"]

  - job_name: "company-service"
    static_configs:
      - targets: ["company-service:3001"]

  - job_name: "fleet-service"
    static_configs:
      - targets: ["fleet-service:3003"]

  - job_name: "shipment-service"
    static_configs:
      - targets: ["shipment-service:3002"]

  - job_name: "tracking-service"
    static_configs:
      - targets: ["tracking-service:3004"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:3005"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:3006"]
