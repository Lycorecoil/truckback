openapi: 3.0.3

info:
  title: Elimmekatruck API
  description: |
    Plateforme logistique B2B microservices — mise en relation transporteurs et entreprises.
    Toutes les requêtes transitent par l'API Gateway (port 3006 / Nginx port 80).
  version: 1.0.0
  contact:
    name: Jean-Baptiste Ilboudou
    email: ilboudojeanbaptiste41@gmail.com

servers:
  - url: http://localhost/api
    description: Développement (Nginx → api-gateway)
  - url: http://localhost:3006
    description: api-gateway direct

tags:
  - name: Health
    description: Healthchecks des services
  - name: Auth
    description: Authentification et gestion des identités
  - name: Company
    description: Entreprises clientes et transporteurs
  - name: Fleet
    description: Camions et chauffeurs
  - name: Shipment
    description: Annonces et cycle de vie des expéditions
  - name: Tracking
    description: Positions GPS en temps réel
  - name: Notification
    description: Envoi de notifications (email, SMS, push)

# ─── Security ──────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        db:
          type: string
          enum: [connected, disconnected]
        uptime:
          type: number
      required: [status]

    # ── Auth ──────────────────────────────────────────────────────────────────

    SignUpRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [COMPANY, TRANSPORTER]
        tenantId:
          type: string
          format: uuid
      required: [email, password, role, tenantId]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'
      required: [accessToken, refreshToken]

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, COMPANY, TRANSPORTER, DRIVER]
        tenantId:
          type: string
          format: uuid

    CreateDriverRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        tenantId:
          type: string
          format: uuid
      required: [email, password, tenantId]

    # ── Company ───────────────────────────────────────────────────────────────

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        phone:
          type: string
        siret:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, email]

    Transporter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        phone:
          type: string
        siret:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, email]

    # ── Fleet ─────────────────────────────────────────────────────────────────

    Truck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        immatriculation:
          type: string
        marque:
          type: string
        modele:
          type: string
        capacite:
          type: number
        statut:
          type: string
          enum: [AVAILABLE, BUSY, MAINTENANCE]
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, immatriculation, statut]

    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string
        numeroPermis:
          type: string
        statut:
          type: string
          enum: [AVAILABLE, BUSY, SUSPENDED]
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, nom, prenom, statut]

    # ── Shipment ──────────────────────────────────────────────────────────────

    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        villeDepart:
          type: string
        paysDepart:
          type: string
        villeArrivee:
          type: string
        paysArrivee:
          type: string
        poids:
          type: number
        description:
          type: string
        statut:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS, DELIVERED, CANCELLED]
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, villeDepart, villeArrivee, poids, statut]

    PaginatedResult:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    # ── Tracking ──────────────────────────────────────────────────────────────

    TrackingPoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        truckId:
          type: string
          format: uuid
        shipmentId:
          type: string
          format: uuid
        latitude:
          type: number
        longitude:
          type: number
        vitesse:
          type: number
          description: Vitesse en km/h (optionnel)
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, truckId, shipmentId, latitude, longitude, timestamp]

    # ── Notification ──────────────────────────────────────────────────────────

    SendEmailRequest:
      type: object
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
        recipientId:
          type: string
          format: uuid
      required: [to, subject, body, recipientId]

    SendSmsRequest:
      type: object
      properties:
        to:
          type: string
          description: Numéro E.164 (ex. +2376XXXXXXXX)
        message:
          type: string
        recipientId:
          type: string
          format: uuid
      required: [to, message, recipientId]

    NotificationRecord:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
        message:
          type: string
        status:
          type: string
          enum: [SENT, FAILED]
        createdAt:
          type: string
          format: date-time

# ─── Paths ─────────────────────────────────────────────────────────────────────

paths:

  # ── Health ───────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Healthcheck API Gateway
      operationId: gatewayHealth
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── Auth ─────────────────────────────────────────────────────────────────────

  /auth/signup:
    post:
      tags: [Auth]
      summary: Créer un compte (COMPANY ou TRANSPORTER)
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Se déconnecter (invalide le refresh token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Déconnexion réussie

  /auth/driver/create:
    post:
      tags: [Auth]
      summary: Créer un compte DRIVER (ADMIN seulement)
      operationId: createDriver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Compte driver créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '403':
          description: Accès refusé (rôle insuffisant)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Réinitialiser le mot de passe
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Email de réinitialisation envoyé

  # ── Company ──────────────────────────────────────────────────────────────────

  /company/companies:
    get:
      tags: [Company]
      summary: Lister les entreprises clientes
      operationId: listCompanies
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Company'
    post:
      tags: [Company]
      summary: Créer une entreprise cliente
      operationId: createCompany
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '201':
          description: Entreprise créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'

  /company/companies/{id}:
    get:
      tags: [Company]
      summary: Récupérer une entreprise
      operationId: getCompany
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entreprise trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          description: Non trouvée
    put:
      tags: [Company]
      summary: Mettre à jour une entreprise
      operationId: updateCompany
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Company'
      responses:
        '200':
          description: Entreprise mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    delete:
      tags: [Company]
      summary: Supprimer une entreprise (soft delete)
      operationId: deleteCompany
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Supprimée

  /company/transporters:
    get:
      tags: [Company]
      summary: Lister les transporteurs
      operationId: listTransporters
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transporter'
    post:
      tags: [Company]
      summary: Créer un transporteur
      operationId: createTransporter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transporter'
      responses:
        '201':
          description: Transporteur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transporter'

  # ── Fleet ─────────────────────────────────────────────────────────────────────

  /fleet/trucks:
    get:
      tags: [Fleet]
      summary: Lister les camions du tenant
      operationId: listTrucks
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: statut
          in: query
          schema:
            type: string
            enum: [AVAILABLE, BUSY, MAINTENANCE]
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Truck'
    post:
      tags: [Fleet]
      summary: Ajouter un camion
      operationId: createTruck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Truck'
      responses:
        '201':
          description: Camion créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'

  /fleet/trucks/match:
    get:
      tags: [Fleet]
      summary: Trouver des camions disponibles pour une expédition
      operationId: matchTrucks
      security:
        - bearerAuth: []
      parameters:
        - name: poids
          in: query
          required: true
          schema:
            type: number
        - name: paysDepart
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Camions disponibles correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Truck'

  /fleet/trucks/{id}:
    get:
      tags: [Fleet]
      summary: Récupérer un camion
      operationId: getTruck
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Camion trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
        '404':
          description: Non trouvé
    put:
      tags: [Fleet]
      summary: Mettre à jour un camion
      operationId: updateTruck
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Truck'
      responses:
        '200':
          description: Camion mis à jour
    delete:
      tags: [Fleet]
      summary: Mettre un camion hors service (MAINTENANCE)
      operationId: deleteTruck
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statut mis à MAINTENANCE

  /fleet/drivers:
    get:
      tags: [Fleet]
      summary: Lister les chauffeurs du tenant
      operationId: listDrivers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Driver'
    post:
      tags: [Fleet]
      summary: Ajouter un chauffeur
      operationId: createDriverFleet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Driver'
      responses:
        '201':
          description: Chauffeur créé

  /fleet/drivers/{id}:
    get:
      tags: [Fleet]
      summary: Récupérer un chauffeur
      operationId: getDriver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chauffeur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '404':
          description: Non trouvé
    put:
      tags: [Fleet]
      summary: Mettre à jour un chauffeur
      operationId: updateDriver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Driver'
      responses:
        '200':
          description: Chauffeur mis à jour
    delete:
      tags: [Fleet]
      summary: Suspendre un chauffeur (statut SUSPENDED)
      operationId: suspendDriver
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chauffeur suspendu

  # ── Shipment ─────────────────────────────────────────────────────────────────

  /shipment/shipments:
    get:
      tags: [Shipment]
      summary: Lister les expéditions du tenant
      operationId: listShipments
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: statut
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, IN_PROGRESS, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Shipment'
    post:
      tags: [Shipment]
      summary: Créer une annonce d'expédition
      operationId: createShipment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shipment'
      responses:
        '201':
          description: Expédition créée avec statut PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'

  /shipment/shipments/search:
    get:
      tags: [Shipment]
      summary: Rechercher des expéditions avec matching camions
      operationId: searchShipments
      security:
        - bearerAuth: []
      parameters:
        - name: poids
          in: query
          schema:
            type: number
        - name: paysDepart
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Expéditions avec camions disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'

  /shipment/shipments/{id}:
    get:
      tags: [Shipment]
      summary: Récupérer une expédition
      operationId: getShipment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expédition trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '404':
          description: Non trouvée
    delete:
      tags: [Shipment]
      summary: Annuler une expédition (statut CANCELLED)
      operationId: cancelShipment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expédition annulée

  /shipment/shipments/{id}/accept:
    post:
      tags: [Shipment]
      summary: Accepter une expédition (lock atomique anti-race)
      operationId: acceptShipment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expédition acceptée (statut ACCEPTED)
        '409':
          description: Déjà acceptée par un autre transporteur

  /shipment/shipments/{id}/start:
    post:
      tags: [Shipment]
      summary: Démarrer une expédition
      operationId: startShipment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expédition en cours (statut IN_PROGRESS)

  /shipment/shipments/{id}/deliver:
    post:
      tags: [Shipment]
      summary: Marquer une expédition comme livrée
      operationId: deliverShipment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Expédition livrée (statut DELIVERED)

  # ── Tracking ─────────────────────────────────────────────────────────────────

  /tracking/tracking:
    post:
      tags: [Tracking]
      summary: Envoyer une position GPS
      operationId: createTrackingPoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                truckId:
                  type: string
                  format: uuid
                shipmentId:
                  type: string
                  format: uuid
                latitude:
                  type: number
                longitude:
                  type: number
                vitesse:
                  type: number
                timestamp:
                  type: string
                  format: date-time
              required: [truckId, shipmentId, latitude, longitude]
      responses:
        '201':
          description: Point GPS enregistré et diffusé via WebSocket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPoint'

  /tracking/tracking/truck/{truckId}:
    get:
      tags: [Tracking]
      summary: Dernière position connue d'un camion
      operationId: getLastPosition
      security:
        - bearerAuth: []
      parameters:
        - name: truckId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dernière position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPoint'
        '404':
          description: Aucune position connue

  /tracking/tracking/truck/{truckId}/history:
