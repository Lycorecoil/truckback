# ─── Nginx dev — HTTP only (pas de TLS en local/staging) ─────────────────────
# Pour la production, utiliser nginx.conf avec TLS + certificats réels.

worker_processes      auto;
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    charset         utf-8;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout     65;
    server_tokens   off;

    # ─── Compression gzip ─────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;

    # ─── Logging structuré ────────────────────────────────────────────────────
    log_format main  '$remote_addr [$time_local] "$request" $status '
                     '$body_bytes_sent rt=$request_time '
                     'rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
    limit_req_status   429;
    limit_conn_status  429;

    # ─── Upstream — 2 instances api-gateway (least_conn) ─────────────────────
    upstream api_gateway {
        server  api-gateway-1:3006  max_fails=3  fail_timeout=30s;
        server  api-gateway-2:3006  max_fails=3  fail_timeout=30s;
        keepalive 64;
        keepalive_requests 100;
    }

    server {
        listen  80;
        server_name _;

        # Security headers (sans HSTS — pas de TLS ici)
        add_header X-Content-Type-Options   "nosniff"                          always;
        add_header X-Frame-Options          "DENY"                             always;
        add_header X-XSS-Protection         "1; mode=block"                    always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;

        client_max_body_size  2m;
        proxy_connect_timeout   5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # ─── Health check ─────────────────────────────────────────────────────
        location = /health {
            proxy_pass  http://api_gateway;
            access_log  off;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
        }

        # ─── Routes auth — rate limiting strict ───────────────────────────────
        location ~ ^/auth/(login|signup|refresh) {
            limit_req       zone=api_auth  burst=5  nodelay;
            proxy_pass      http://api_gateway;
            include         /etc/nginx/conf.d/proxy_params.conf;
        }

        # ─── WebSocket tracking ───────────────────────────────────────────────
        location /ws {
            proxy_pass              http://tracking-service:3007;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade             $http_upgrade;
            proxy_set_header        Connection          "upgrade";
            proxy_set_header        Host                $host;
            proxy_set_header        X-Real-IP           $remote_addr;
            proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_read_timeout      3600s;
            limit_conn              ws_conn 10;
        }

        # ─── API générale ─────────────────────────────────────────────────────
        location / {
            limit_req       zone=api_general  burst=30  nodelay;
            proxy_pass      http://api_gateway;
            include         /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
