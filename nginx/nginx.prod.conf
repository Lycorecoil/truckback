# ─── Nginx production — HTTPS + HTTP→HTTPS redirect ─────────────────────────
# Prérequis :
#   - Certificats Let's Encrypt dans /etc/letsencrypt/live/${DOMAIN}/
#   - Générer avec : certbot certonly --standalone -d ${DOMAIN}
#   - Renouvellement auto : cron "0 3 * * * certbot renew --quiet && nginx -s reload"

worker_processes      auto;
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    charset         utf-8;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout     65;
    server_tokens   off;

    # ─── Logging structuré ────────────────────────────────────────────────────
    log_format main  '$remote_addr [$time_local] "$request" $status '
                     '$body_bytes_sent rt=$request_time '
                     'rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
    limit_req_status   429;
    limit_conn_status  429;

    # ─── Upstream — 2 instances api-gateway (least_conn) ─────────────────────
    upstream api_gateway {
        least_conn;
        server  api-gateway-1:3006  max_fails=3  fail_timeout=30s;
        server  api-gateway-2:3006  max_fails=3  fail_timeout=30s;
        keepalive 32;
    }

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        # Certificats Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        # TLS moderne (Mozilla Intermediate)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout    5s;

        # Security headers (HSTS inclus en prod)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Content-Security-Policy   "default-src 'self'"                           always;

        client_max_body_size  2m;
        proxy_connect_timeout   5s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # ─── Health check ─────────────────────────────────────────────────────
        location = /health {
            proxy_pass  http://api_gateway;
            access_log  off;
            proxy_set_header Host        $host;
            proxy_set_header X-Real-IP   $remote_addr;
        }

        # ─── Renouvellement Let's Encrypt (certbot webroot) ───────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ─── Routes auth — rate limiting strict ───────────────────────────────
        location ~ ^/auth/(login|signup|refresh) {
            limit_req       zone=api_auth  burst=5  nodelay;
            proxy_pass      http://api_gateway;
            include         /etc/nginx/conf.d/proxy_params.conf;
        }

        # ─── WebSocket tracking ───────────────────────────────────────────────
        location /ws {
            proxy_pass              http://tracking-service:3007;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade             $http_upgrade;
            proxy_set_header        Connection          "upgrade";
            proxy_set_header        Host                $host;
            proxy_set_header        X-Real-IP           $remote_addr;
            proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_read_timeout      3600s;
            limit_conn              ws_conn 10;
        }

        # ─── API générale ─────────────────────────────────────────────────────
        location / {
            limit_req       zone=api_general  burst=30  nodelay;
            proxy_pass      http://api_gateway;
            include         /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
