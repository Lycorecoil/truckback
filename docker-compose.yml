version: "3.9"

# ─── Fragment réutilisable : environnement commun api-gateway ─────────────────
x-gateway-env: &gateway-env
  PORT: 3006
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET}
  REDIS_URL: redis://redis:6379
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  AUTH_SERVICE_URL: http://auth-service:3000
  COMPANY_SERVICE_URL: http://company-service:3001
  SHIPMENT_SERVICE_URL: http://shipment-service:3002
  FLEET_SERVICE_URL: http://fleet-service:3003
  TRACKING_SERVICE_URL: http://tracking-service:3004
  NOTIFICATION_SERVICE_URL: http://notification-service:3005

x-gateway-depends: &gateway-depends
  auth-service:
    condition: service_healthy
  company-service:
    condition: service_healthy
  fleet-service:
    condition: service_healthy
  shipment-service:
    condition: service_healthy
  tracking-service:
    condition: service_healthy
  notification-service:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  # Génère le keyFile MongoDB (requis : replSet + auth) — one-shot, idempotent
  mongo-keyfile-setup:
    image: mongo:7
    container_name: elimmekatruck-mongo-keyfile-setup
    restart: "no"
    user: "999:999"
    volumes:
      - mongo_keyfile:/keyfile
    command: >
      bash -c "
        [ -f /keyfile/mongo.key ] ||
        (openssl rand -base64 756 > /keyfile/mongo.key && chmod 400 /keyfile/mongo.key)
      "

  mongodb:
    image: mongo:7
    container_name: elimmekatruck-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/mongo.key"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    depends_on:
      mongo-keyfile-setup:
        condition: service_completed_successfully
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialise le replica set au premier démarrage (one-shot, idempotent)
  mongodb-init:
    image: mongo:7
    container_name: elimmekatruck-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb:27017
        -u ${MONGO_ROOT_USER:-root}
        -p ${MONGO_ROOT_PASSWORD}
        --authenticationDatabase admin
        --eval "
          try { rs.status(); print('replica set already initiated'); }
          catch(e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
            print('replica set initiated');
          }
        "

  redis:
    image: redis:7-alpine
    container_name: elimmekatruck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Observabilité ───────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: elimmekatruck-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: elimmekatruck-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FALLBACK_EMAIL: ${FALLBACK_EMAIL:-ilboudojeanbaptiste41@gmail.com}

  grafana:
    image: grafana/grafana:10.4.2
    container_name: elimmekatruck-grafana
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ─── Reverse Proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: elimmekatruck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api-gateway-1:
        condition: service_healthy
      api-gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Microservices ───────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      SERVICE_NAME: auth-service
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/auth-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 1h
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  company-service:
    build:
      context: ./company-service
    container_name: company-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SERVICE_NAME: company-service
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/company-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  fleet-service:
    build:
      context: ./fleet-service
    container_name: fleet-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      SERVICE_NAME: fleet-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/fleet-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  shipment-service:
    build:
      context: ./shipment-service
    container_name: shipment-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      SERVICE_NAME: shipment-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/shipment-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      FLEET_SERVICE_URL: http://fleet-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      COMPANY_SERVICE_URL: http://company-service:3001
      FALLBACK_EMAIL: ${FALLBACK_EMAIL:-ilboudojeanbaptiste41@gmail.com}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      fleet-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  tracking-service:
    build:
      context: ./tracking-service
    container_name: tracking-service
    restart: unless-stopped
    ports:
      - "3004:3004"
      - "3007:3007"
    environment:
      PORT: 3004
      WS_PORT: 3007
      NODE_ENV: production
      SERVICE_NAME: tracking-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/tracking-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: production
      SERVICE_NAME: notification-service
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/notification-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── API Gateway — 2 instances (load balancé par Nginx) ──────────────────────

  api-gateway-1:
    build:
      context: ./api-gateway
    container_name: api-gateway-1
    restart: unless-stopped
    environment:
      <<: *gateway-env
      SERVICE_NAME: api-gateway-1
    depends_on: *gateway-depends
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway-2:
    build:
      context: ./api-gateway
    container_name: api-gateway-2
    restart: unless-stopped
    environment:
      <<: *gateway-env
      SERVICE_NAME: api-gateway-2
    depends_on: *gateway-depends
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
  mongo_keyfile:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
