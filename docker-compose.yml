version: "3.9"

# ─── Fragment réutilisable : environnement commun api-gateway ─────────────────
x-gateway-env: &gateway-env
  PORT: 3006
  NODE_ENV: production
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
  REDIS_URL: redis://redis:6379
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  AUTH_SERVICE_URL: http://auth-service:3000
  COMPANY_SERVICE_URL: http://company-service:3001
  SHIPMENT_SERVICE_URL: http://shipment-service:3002
  FLEET_SERVICE_URL: http://fleet-service:3003
  TRACKING_SERVICE_URL: http://tracking-service:3004
  NOTIFICATION_SERVICE_URL: http://notification-service:3005
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-2000}

x-gateway-depends: &gateway-depends
  auth-service:
    condition: service_healthy
  company-service:
    condition: service_healthy
  fleet-service:
    condition: service_healthy
  shipment-service:
    condition: service_healthy
  tracking-service:
    condition: service_healthy
  notification-service:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  # Génère le keyFile MongoDB (requis : replSet + auth) — one-shot, idempotent
  mongo-keyfile-setup:
    image: mongo:7
    container_name: elimmekatruck-mongo-keyfile-setup
    restart: "no"
    user: "0:0"
    volumes:
      - mongo_keyfile:/keyfile
    command: >
      bash -c "
        [ -f /keyfile/mongo.key ] ||
        (openssl rand -base64 756 > /keyfile/mongo.key &&
         chmod 400 /keyfile/mongo.key &&
         chown 999:999 /keyfile/mongo.key)
      "

  mongodb:
    image: mongo:7
    container_name: elimmekatruck-mongo
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/keyfile/mongo.key"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    depends_on:
      mongo-keyfile-setup:
        condition: service_completed_successfully
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialise le replica set au premier démarrage (one-shot, idempotent)
  mongodb-init:
    image: mongo:7
    container_name: elimmekatruck-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongodb:27017
        -u ${MONGO_ROOT_USER:-root}
        -p ${MONGO_ROOT_PASSWORD}
        --authenticationDatabase admin
        --eval "
          try { rs.status(); print('replica set already initiated'); }
          catch(e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
            print('replica set initiated');
          }
        "

  redis:
    image: redis:7-alpine
    container_name: elimmekatruck-redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Observabilité ───────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: elimmekatruck-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: elimmekatruck-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FALLBACK_EMAIL: ${FALLBACK_EMAIL:-ilboudojeanbaptiste41@gmail.com}

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: elimmekatruck-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  loki:
    image: grafana/loki:2.9.5
    container_name: elimmekatruck-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.5
    container_name: elimmekatruck-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

  grafana:
    image: grafana/grafana:10.4.2
    container_name: elimmekatruck-grafana
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ─── Reverse Proxy ───────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: elimmekatruck-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./adminkit-3.1.0/adminkit-3.1.0/static:/var/www/app:ro
      - truck_uploads:/var/www/uploads:ro
    depends_on:
      api-gateway-1:
        condition: service_healthy
      api-gateway-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Microservices ───────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      SERVICE_NAME: auth-service
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/auth-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 1h
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      UV_THREADPOOL_SIZE: "4"
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  company-service:
    build:
      context: ./company-service
    container_name: company-service
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SERVICE_NAME: company-service
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/company-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_RATE_LIMIT_MAX: ${INTERNAL_RATE_LIMIT_MAX:-300}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  fleet-service:
    build:
      context: ./fleet-service
    container_name: fleet-service
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      SERVICE_NAME: fleet-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/fleet-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_URL: redis://redis:6379
      INTERNAL_RATE_LIMIT_MAX: ${INTERNAL_RATE_LIMIT_MAX:-300}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internal-secret-elimmeka}
      UPLOAD_DIR: /app/uploads
    volumes:
      - truck_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  shipment-service:
    build:
      context: ./shipment-service
    container_name: shipment-service
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      SERVICE_NAME: shipment-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/shipment-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      FLEET_SERVICE_URL: http://fleet-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      COMPANY_SERVICE_URL: http://company-service:3001
      FALLBACK_EMAIL: ${FALLBACK_EMAIL:-ilboudojeanbaptiste41@gmail.com}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-internal-secret-elimmeka}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_RATE_LIMIT_MAX: ${INTERNAL_RATE_LIMIT_MAX:-300}
    depends_on:
      fleet-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  tracking-service:
    build:
      context: ./tracking-service
    container_name: tracking-service
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    restart: unless-stopped
    ports:
      - "3004:3004"
      - "3007:3007"
    environment:
      PORT: 3004
      WS_PORT: 3007
      NODE_ENV: production
      SERVICE_NAME: tracking-service
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/tracking-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      INTERNAL_RATE_LIMIT_MAX: ${INTERNAL_RATE_LIMIT_MAX:-300}
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
    restart: unless-stopped
    ports:
      - "3005:3005"
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
    environment:
      PORT: 3005
      NODE_ENV: production
      SERVICE_NAME: notification-service
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/notification-service?authSource=admin&replicaSet=rs0&serverSelectionTimeoutMS=5000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      WHATSAPP_SESSION_PATH: /app/.wwebjs_auth
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Sauvegarde MongoDB (mongodump toutes les 24h → volume local) ────────────
  mongo-backup:
    image: mongo:7
    container_name: elimmekatruck-mongo-backup
    restart: unless-stopped
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - mongo_backups:/backups
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    entrypoint: >
      bash -c "
        echo '[mongo-backup] Service de sauvegarde démarré' &&
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S) &&
          echo \"[$$TIMESTAMP] Début de la sauvegarde...\" &&
          mongodump
            --host mongodb:27017
            --username $$MONGO_ROOT_USER
            --password $$MONGO_ROOT_PASSWORD
            --authenticationDatabase admin
            --out /backups/$$TIMESTAMP
            --gzip &&
          echo \"[$$TIMESTAMP] Sauvegarde terminée\" &&
          find /backups -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + &&
          sleep $$(( $${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        done
      "
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ─── API Gateway — 2 instances (load balancé par Nginx) ──────────────────────

  api-gateway-1:
    build:
      context: ./api-gateway
    container_name: api-gateway-1
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
    restart: unless-stopped
    environment:
      <<: *gateway-env
      SERVICE_NAME: api-gateway-1
    depends_on: *gateway-depends
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway-2:
    build:
      context: ./api-gateway
    container_name: api-gateway-2
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
    restart: unless-stopped
    environment:
      <<: *gateway-env
      SERVICE_NAME: api-gateway-2
    depends_on: *gateway-depends
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
  mongo_keyfile:
    driver: local
  mongo_backups:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  whatsapp_session:
    driver: local
  truck_uploads:
    driver: local
