version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    container_name: elimmekatruck-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microservices ───────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      SERVICE_NAME: auth-service
      DATABASE_URL: mongodb://root:rootpass@mongodb:27017/auth-service?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 1h
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  company-service:
    build:
      context: ./company-service
    container_name: company-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      SERVICE_NAME: company-service
      MONGO_URI: mongodb://root:rootpass@mongodb:27017/company-service?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  fleet-service:
    build:
      context: ./fleet-service
    container_name: fleet-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      SERVICE_NAME: fleet-service
      MONGODB_URI: mongodb://root:rootpass@mongodb:27017/fleet-service?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  shipment-service:
    build:
      context: ./shipment-service
    container_name: shipment-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      SERVICE_NAME: shipment-service
      MONGODB_URI: mongodb://root:rootpass@mongodb:27017/shipment-service?authSource=admin
      FLEET_SERVICE_URL: http://fleet-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      COMPANY_SERVICE_URL: http://company-service:3001
      FALLBACK_EMAIL: ${FALLBACK_EMAIL:-ilboudojeanbaptiste41@gmail.com}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      fleet-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  tracking-service:
    build:
      context: ./tracking-service
    container_name: tracking-service
    restart: unless-stopped
    ports:
      - "3004:3004"
      - "3007:3007"
    environment:
      PORT: 3004
      WS_PORT: 3007
      NODE_ENV: production
      SERVICE_NAME: tracking-service
      MONGODB_URI: mongodb://root:rootpass@mongodb:27017/tracking-service?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: production
      SERVICE_NAME: notification-service
      DATABASE_URL: mongodb://root:rootpass@mongodb:27017/notification-service?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY}
      AT_SENDER_ID: ${AT_SENDER_ID:-CamionUber}
      AT_SANDBOX: ${AT_SANDBOX:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      NODE_ENV: production
      SERVICE_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3001
      SHIPMENT_SERVICE_URL: http://shipment-service:3002
      FLEET_SERVICE_URL: http://fleet-service:3003
      TRACKING_SERVICE_URL: http://tracking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
