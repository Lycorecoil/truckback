name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  # ─── Tests unitaires et d'intégration par service ────────────────────────────
  test:
    name: Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - company-service
          - fleet-service
          - shipment-service
          - tracking-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit --coverage
        working-directory: ${{ matrix.service }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          retention-days: 7

  # ─── Vérification TypeScript (tsc --noEmit) ───────────────────────────────────
  typecheck:
    name: Typecheck — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - company-service
          - fleet-service
          - shipment-service
          - tracking-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  # ─── Build Docker (valide que l'image se construit) ──────────────────────────
  docker-build:
    name: Docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./auth-service
          - service: company-service
            context: ./company-service
          - service: fleet-service
            context: ./fleet-service
          - service: shipment-service
            context: ./shipment-service
          - service: tracking-service
            context: ./tracking-service
          - service: notification-service
            context: ./notification-service
          - service: api-gateway
            context: ./api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: elimmekatruck/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Audit de sécurité des dépendances ────────────────────────────────────────
  audit:
    name: Security audit — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - company-service
          - fleet-service
          - shipment-service
          - tracking-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.service }}

  # ─── Trivy — scan de sécurité des images Docker ──────────────────────────────
  trivy:
    name: Trivy scan — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: ./auth-service
          - service: company-service
            context: ./company-service
          - service: fleet-service
            context: ./fleet-service
          - service: shipment-service
            context: ./shipment-service
          - service: tracking-service
            context: ./tracking-service
          - service: notification-service
            context: ./notification-service
          - service: api-gateway
            context: ./api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: elimmekatruck/${{ matrix.service }}:scan
          load: true
          cache-from: type=gha

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: elimmekatruck/${{ matrix.service }}:scan
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─── Lint ESLint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - company-service
          - fleet-service
          - shipment-service
          - tracking-service
          - notification-service
          - api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: ESLint
        run: npx eslint src --ext .ts
        working-directory: ${{ matrix.service }}
