name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  # ─── Détection des services modifiés ─────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'auth-service/**'
            company-service:
              - 'company-service/**'
            fleet-service:
              - 'fleet-service/**'
            shipment-service:
              - 'shipment-service/**'
            tracking-service:
              - 'tracking-service/**'
            notification-service:
              - 'notification-service/**'
            api-gateway:
              - 'api-gateway/**'

      # Si aucun service modifié (ex: push sur ci.yml seulement) → tous les services
      - id: set-matrix
        run: |
          SERVICES='${{ steps.filter.outputs.changes }}'
          if [ "$SERVICES" = "[]" ] || [ -z "$SERVICES" ]; then
            echo 'services=["auth-service","company-service","fleet-service","shipment-service","tracking-service","notification-service","api-gateway"]' >> $GITHUB_OUTPUT
          else
            echo "services=$SERVICES" >> $GITHUB_OUTPUT
          fi

  # ─── Tests unitaires et d'intégration ────────────────────────────────────────
  test:
    name: Tests — ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npm test -- --passWithNoTests --forceExit --coverage
        working-directory: ${{ matrix.service }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          retention-days: 7

  # ─── Vérification TypeScript ──────────────────────────────────────────────────
  typecheck:
    name: Typecheck — ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  # ─── Lint ESLint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint — ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npx eslint src --ext .ts
        working-directory: ${{ matrix.service }}

  # ─── Audit de sécurité des dépendances ────────────────────────────────────────
  audit:
    name: Security audit — ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npm audit --audit-level=critical
        working-directory: ${{ matrix.service }}

  # ─── Build Docker ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build — ${{ matrix.service }}
    needs: [test, changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: elimmekatruck/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Trivy — scan de sécurité des images Docker ──────────────────────────────
  trivy:
    name: Trivy scan — ${{ matrix.service }}
    needs: [docker-build, changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: elimmekatruck/${{ matrix.service }}:scan
          load: true
          cache-from: type=gha

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: elimmekatruck/${{ matrix.service }}:scan
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
