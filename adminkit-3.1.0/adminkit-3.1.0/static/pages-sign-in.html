<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Connexion | Elimmekatruck</title>
  <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
  <link href="css/app.css" rel="stylesheet">
  <link href="css/cu-theme.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="alert-container" style="position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;width:400px;max-width:90vw"></div>
<div class="cu-auth-wrap">

  <!-- LEFT PANEL -->
  <div class="cu-auth-left">
    <div class="cu-auth-logo">
      <span style="font-size:2rem">🚛</span>
      <div>
        <div style="font-size:1.1rem;font-weight:800">Camion Uber</div>
        <div style="font-size:.65rem;opacity:.6;letter-spacing:.12em;text-transform:uppercase">Afrique de l'Ouest</div>
      </div>
    </div>
    <div>
      <div class="cu-auth-tagline">La logistique B2B,<br>simplifiée.</div>
      <div class="cu-auth-pills">
        <span class="cu-auth-pill">⚡ Matching instantané</span>
        <span class="cu-auth-pill">📍 Tracking temps réel</span>
        <span class="cu-auth-pill">🌍 Afrique de l'Ouest</span>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="cu-auth-right">
    <div class="cu-auth-form">
      <div class="cu-auth-title">Bienvenue</div>
      <div class="cu-auth-sub">Connectez-vous à votre portail</div>

      <form id="form-login">
        <div class="mb-4">
          <label class="cu-auth-label" for="email">Email professionnel</label>
          <input id="email" name="email" autocomplete="email" class="cu-auth-input" type="email" placeholder="contact@votreentreprise.com" required />
        </div>
        <div class="mb-2">
          <label class="cu-auth-label" for="password">Mot de passe</label>
          <input id="password" name="password" autocomplete="current-password" class="cu-auth-input" type="password" placeholder="••••••••" required />
        </div>
        <div class="d-flex justify-content-end mb-1">
          <a href="#" class="cu-auth-link" style="font-size:.82rem">Mot de passe oublié ?</a>
        </div>
        <button id="btn-submit" type="submit" class="cu-auth-btn">Se connecter</button>
      </form>

      <div class="text-center mt-4" style="color:#6B7280;font-size:.875rem">
        Pas encore de compte ? <a href="pages-sign-up.html" class="cu-auth-link">S'inscrire</a>
      </div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
<script src="js/app-elimmeka.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.redirectIfLoggedIn();

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    UI.loading(btn, true);
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? 'Identifiants incorrects');

      const u = data.user ?? data;
      const token = data.token ?? data.accessToken;

      // Récupérer le profil organisation + la version courante des Conditions Générales d'Utilisation
      let raisonSociale = null, logo = null, orgId = null, termsAcceptedVersion = null;

      // Version des Conditions Générales active sur le backend
      try {
        const cguRes = await fetch(`${API}/company/cgu/current`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        if (cguRes.ok) {
          const cguBody = await cguRes.json();
          const cguActive = cguBody.data;
          if (cguActive?.version) CURRENT_TERMS_VERSION = cguActive.version;
        }
      } catch (_) {}

      if (u.role === 'EXPEDITEUR' || u.role === 'TRANSPORTER') {
        const route = u.role === 'EXPEDITEUR' ? 'company' : 'transporter';
        try {
          const orgRes = await fetch(`${API}/company/${route}/tenant/${u.tenantId}`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
          });
          if (orgRes.ok) {
            const body = await orgRes.json();
            const org  = body.data ?? body;
            raisonSociale        = org.raisonSociale ?? null;
            logo                 = org.logo ?? null;
            orgId                = org.id ?? null;
            termsAcceptedVersion = org.termsAcceptedVersion ?? null;
          }
        } catch (_) {}
      }

      Auth.saveSession(token, {
        id: u.id ?? u.sub,
        email: u.email ?? email,
        role: u.role,
        tenantId: u.tenantId,
        raisonSociale,
        logo,
        orgId,
        termsAcceptedVersion,
      });

      Auth.redirectByRole();
    } catch (err) {
      UI.alert(err.message ?? 'Erreur de connexion');
      UI.loading(btn, false);
    }
  });
});
</script>
</body>
</html>
