<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Organisations | Admin | Elimmekatruck</title>
  <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
  <link href="css/app.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">

  <nav id="sidebar" class="sidebar js-sidebar">
    <div class="sidebar-content js-simplebar">
      <a class="sidebar-brand" href="admin-dashboard.html"><span class="align-middle">🚛 Elimmekatruck</span></a>
      <ul class="sidebar-nav">
        <li class="sidebar-header">Administration</li>
        <li class="sidebar-item"><a class="sidebar-link" href="admin-dashboard.html"><i class="align-middle" data-feather="bar-chart-2"></i> <span class="align-middle">Dashboard Global</span></a></li>
        <li class="sidebar-item"><a class="sidebar-link" href="admin-expeditions.html"><i class="align-middle" data-feather="package"></i> <span class="align-middle">Toutes les expéditions</span></a></li>
        <li class="sidebar-item active"><a class="sidebar-link" href="admin-utilisateurs.html"><i class="align-middle" data-feather="users"></i> <span class="align-middle">Organisations</span></a></li>
      </ul>
    </div>
  </nav>

  <div class="main">
    <nav class="navbar navbar-expand navbar-light navbar-bg">
      <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
      <div class="navbar-collapse collapse">
        <ul class="navbar-nav navbar-align">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-none d-sm-inline-block" href="#" data-bs-toggle="dropdown">
              <i class="align-middle me-1" data-feather="user"></i> <span id="navbar-user-name" class="text-dark">—</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" href="#" id="btn-logout"><i class="align-middle me-1" data-feather="log-out"></i> Déconnexion</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>

    <main class="content">
      <div class="container-fluid p-0">

        <h1 class="h3 mb-3"><strong>Organisations</strong></h1>

        <ul class="nav nav-tabs mb-3" id="orgTabs">
          <li class="nav-item"><button class="nav-link active" data-tab="expediteurs">Expéditeurs</button></li>
          <li class="nav-item"><button class="nav-link" data-tab="transporteurs">Transporteurs</button></li>
        </ul>

        <div id="tab-expediteurs">
          <div class="card">
            <table class="table table-hover my-0">
              <thead><tr><th>Société</th><th>Email</th><th class="d-none d-md-table-cell">Téléphone</th><th>Statut</th></tr></thead>
              <tbody id="tbody-expediteurs"><tr><td colspan="4" class="text-center py-4 text-muted">Chargement...</td></tr></tbody>
            </table>
          </div>
        </div>

        <div id="tab-transporteurs" class="d-none">
          <div class="card">
            <table class="table table-hover my-0">
              <thead><tr><th>Société</th><th>Email</th><th class="d-none d-md-table-cell">Téléphone</th><th>Statut</th></tr></thead>
              <tbody id="tbody-transporteurs"><tr><td colspan="4" class="text-center py-4 text-muted">Chargement...</td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <footer class="footer">
      <div class="container-fluid"><div class="row text-muted"><div class="col-6 text-start"><p class="mb-0"><strong>Elimmekatruck</strong> &copy; 2026</p></div></div></div>
    </footer>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/app-elimmeka.js"></script>
<script>
function renderOrgs(list, tbodyId) {
  const tbody = document.getElementById(tbodyId);
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Aucune organisation.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(o => `
    <tr>
      <td><strong>${o.companyName ?? o.name ?? '—'}</strong></td>
      <td>${o.email ?? '—'}</td>
      <td class="d-none d-md-table-cell">${o.phone ?? '—'}</td>
      <td><span class="badge ${o.status === 'ACTIVE' || !o.status ? 'bg-success' : 'bg-danger'}">${o.status ?? 'ACTIVE'}</span></td>
    </tr>
  `).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;
  UI.fillNavbar();

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-expediteurs').classList.add('d-none');
      document.getElementById('tab-transporteurs').classList.add('d-none');
      document.getElementById('tab-' + btn.dataset.tab).classList.remove('d-none');
    });
  });

  const [expedRes, transRes] = await Promise.all([
    api.get('/company/company?page=1&limit=100'),
    api.get('/company/transporter?page=1&limit=100'),
  ]);

  renderOrgs(expedRes?.data ?? expedRes ?? [], 'tbody-expediteurs');
  renderOrgs(transRes?.data ?? transRes ?? [], 'tbody-transporteurs');
});
</script>
</body>
</html>
