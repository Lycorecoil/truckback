<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Inscription | Elimmekatruck</title>
  <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
  <link href="css/app.css" rel="stylesheet">
  <link href="css/cu-theme.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="d-flex w-100">
  <div class="container d-flex flex-column">
    <div class="row vh-100">
      <div class="col-sm-10 col-md-8 col-lg-6 mx-auto d-table h-100">
        <div class="d-table-cell align-middle">

          <div class="text-center mt-4 mb-4">
            <h1 class="h2">🚛 Elimmekatruck</h1>
            <p class="lead text-muted">Créez votre compte</p>
          </div>

          <div id="alert-container"></div>

          <div class="card">
            <div class="card-body">
              <div class="m-sm-3">
                <form id="form-register">

                  <input type="hidden" id="role" value="">

                  <div class="mb-3" id="role-select-wrapper">
                    <label class="form-label" for="role-select">Type de compte</label>
                    <select id="role-select" class="form-select form-select-lg">
                      <option value="">-- Choisir --</option>
                      <option value="EXPEDITEUR">Expéditeur (entreprise)</option>
                      <option value="TRANSPORTEUR">Transporteur (flotte)</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="companyName">Nom de la société</label>
                    <input id="companyName" class="form-control form-control-lg" type="text" placeholder="Ma Société SARL" required />
                  </div>

                  <hr class="my-3">
                  <p class="text-muted small mb-3"><strong>Informations du représentant légal</strong> — utilisées pour votre compte de connexion</p>

                  <div class="mb-3">
                    <label class="form-label" for="email">Adresse email du représentant</label>
                    <input id="email" class="form-control form-control-lg" type="email" autocomplete="email" placeholder="representant@societe.com" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="phone">Téléphone du représentant</label>
                    <input id="phone" class="form-control form-control-lg" type="tel" autocomplete="tel" placeholder="+226 70 00 00 00" />
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe <small class="text-muted">(min. 8 caractères)</small></label>
                    <input id="password" class="form-control form-control-lg" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="8" />
                  </div>

                  <div class="text-center mt-3">
                    <button id="btn-submit" type="submit" class="btn btn-lg btn-primary w-100">Créer mon compte</button>
                  </div>
                </form>
                <div class="text-center mt-3">
                  <small>Déjà inscrit ? <a href="pages-sign-in.html">Se connecter</a></small>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/app-elimmeka.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  Auth.redirectIfLoggedIn();

  // Gérer le type de compte depuis l'URL
  const params = new URLSearchParams(window.location.search);
  const typeParam = params.get('type');

  if (typeParam && ['EXPEDITEUR', 'TRANSPORTEUR'].includes(typeParam)) {
    document.getElementById('role').value = typeParam;
    document.getElementById('role-select-wrapper').style.display = 'none';
    document.querySelector('.lead').textContent = 
      typeParam === 'TRANSPORTEUR' 
        ? 'Créez votre compte transporteur' 
        : 'Créez votre compte expéditeur';
  }

  document.getElementById('form-register').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const role = document.getElementById('role').value;
    const companyName = document.getElementById('companyName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;

    if (!role) { UI.alert('Veuillez choisir un type de compte.'); return; }

    UI.loading(btn, true);
    try {
      const tenantId = crypto.randomUUID();
      const res = await fetch(`${API}/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role, tenantId })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? 'Erreur lors de la création du compte');

      Auth.saveSession(data.token, {
        id: data.id,
        email: data.email ?? email,
        role: data.role,
        tenantId,
      });
      window.location.href = 'onboarding.html';
    } catch (err) {
      UI.alert(err.message ?? 'Erreur de création de compte');
      UI.loading(btn, false);
    }
  });
});
</script>
</body>
</html>
