<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Expéditions disponibles | Elimmekatruck</title>
  <link rel="shortcut icon" href="img/icons/icon-48x48.png" />
  <link href="css/app.css" rel="stylesheet">
  <link href="css/cu-theme.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">

  <nav id="sidebar" class="sidebar js-sidebar">
    <div class="sidebar-content js-simplebar">
      <a class="sidebar-brand" id="sidebar-brand"><span class="align-middle">🚛 Elimmekatruck</span></a>
      <ul class="sidebar-nav" id="sidebar-nav"></ul>
    </div>
  </nav>

  <div class="main">
    <nav class="navbar navbar-expand navbar-light navbar-bg">
      <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
      <div class="navbar-collapse collapse">
        <ul class="navbar-nav navbar-align">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-none d-sm-inline-block" href="#" data-bs-toggle="dropdown">
              <i class="align-middle me-1" data-feather="user"></i>
              <span id="navbar-user-name" class="text-dark">—</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item" href="profil.html"><i class="align-middle me-1" data-feather="settings"></i> Mon profil</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" href="#" id="btn-logout"><i class="align-middle me-1" data-feather="log-out"></i> Déconnexion</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>

    <main class="content">
      <div class="container-fluid p-0">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h1 class="h3 mb-1"><strong>Expéditions disponibles</strong></h1>
            <p class="text-muted mb-0" id="page-subtitle">Chargement...</p>
          </div>
          <a id="btn-back" href="#" class="btn btn-light">
            <i class="align-middle" data-feather="arrow-left" style="width:14px"></i> Retour
          </a>
        </div>

        <div id="alert-container"></div>

        <!-- Filtres avancés -->
        <div class="card mb-3">
          <div class="card-header py-2 d-flex justify-content-between align-items-center" style="cursor:pointer" onclick="toggleFilters()">
            <span class="fw-semibold">
              <i data-feather="filter" class="align-middle me-1" style="width:15px;height:15px"></i>
              Filtres avancés
              <span id="filter-badge" class="badge bg-primary ms-1 d-none">0</span>
            </span>
            <i data-feather="chevron-down" id="filter-chevron" class="align-middle" style="width:16px;height:16px;transition:transform .2s"></i>
          </div>
          <div id="filter-panel" class="card-body">
            <div class="row g-2">

              <div class="col-md-4 col-6">
                <label class="form-label small mb-1">Marchandise</label>
                <input id="f-marchandise" class="form-control form-control-sm" placeholder="haricot, ciment, pneu..." oninput="applyFilters()" />
              </div>

              <div class="col-md-4 col-6">
                <label class="form-label small mb-1">Pays de départ</label>
                <select id="f-pays-depart" class="form-select form-select-sm country-select" onchange="applyFilters()"></select>
              </div>

              <div class="col-md-4 col-6">
                <label class="form-label small mb-1">Pays d'arrivée</label>
                <select id="f-pays-arrivee" class="form-select form-select-sm country-select" onchange="applyFilters()"></select>
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Ville de départ</label>
                <input id="f-ville-depart" class="form-control form-control-sm" placeholder="Ouagadougou..." oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Ville d'arrivée</label>
                <input id="f-ville-arrivee" class="form-control form-control-sm" placeholder="Abidjan..." oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Poids min (T)</label>
                <input id="f-poids-min" type="number" class="form-control form-control-sm" placeholder="0" min="0" step="0.1" oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Poids max (T)</label>
                <input id="f-poids-max" type="number" class="form-control form-control-sm" placeholder="∞" min="0" step="0.1" oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Prix min (FCFA)</label>
                <input id="f-prix-min" type="number" class="form-control form-control-sm" placeholder="0" min="0" oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Prix max (FCFA)</label>
                <input id="f-prix-max" type="number" class="form-control form-control-sm" placeholder="∞" min="0" oninput="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Du</label>
                <input id="f-date-debut" type="date" class="form-control form-control-sm" onchange="applyFilters()" />
              </div>

              <div class="col-md-3 col-6">
                <label class="form-label small mb-1">Au</label>
                <input id="f-date-fin" type="date" class="form-control form-control-sm" onchange="applyFilters()" />
              </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
              <span id="filter-result-count" class="text-muted small"></span>
              <button class="btn btn-sm btn-outline-secondary" onclick="resetFilters()">
                <i data-feather="x" class="align-middle me-1" style="width:13px"></i> Réinitialiser
              </button>
            </div>
          </div>
        </div>

        <div id="cards-container" class="row g-3">
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border me-2"></div> Chargement...
          </div>
        </div>

      </div>
    </main>

    <footer class="footer">
      <div class="container-fluid"><div class="row text-muted"><div class="col-6 text-start"><p class="mb-0"><strong>Elimmekatruck</strong> &copy; 2026</p></div></div></div>
    </footer>
  </div>
</div>

<!-- ── OVERLAY DÉTAIL ──────────────────────────────────────────────────── -->
<div id="detail-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:28px 32px;max-width:500px;width:92%;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Détail de l'expédition</h5>
      <button class="btn btn-sm btn-light" onclick="closeDetail()"><i data-feather="x" style="width:14px"></i></button>
    </div>
    <div id="detail-content"></div>
    <div class="d-flex gap-2 justify-content-end mt-4">
      <button class="btn btn-outline-secondary" onclick="closeDetail()">Fermer</button>
      <button class="btn btn-success" id="btn-interested">
        <i class="align-middle me-1" data-feather="check-circle" style="width:14px"></i> Je suis intéressé
      </button>
    </div>
  </div>
</div>

<!-- ── OVERLAY MODIFIER (EXPEDITEUR) ──────────────────────────────────── -->
<div id="edit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center" onclick="if(event.target===this)closeEdit()">
  <div style="background:#fff;border-radius:12px;padding:28px 32px;max-width:560px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="mb-0 fw-bold">Modifier l'expédition</h5>
      <button class="btn btn-sm btn-light" onclick="closeEdit()"><i data-feather="x" style="width:14px"></i></button>
    </div>
    <form id="edit-form">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label small fw-semibold">Marchandise</label>
          <input id="edit-marchandise" class="form-control" required />
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Poids (tonnes)</label>
          <input id="edit-poids" type="number" class="form-control" step="0.01" min="0.01" required />
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Quantité</label>
          <input id="edit-quantite" type="number" class="form-control" min="1" />
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Ville départ</label>
          <input id="edit-villeDepart" class="form-control" required />
        </div>
        <div class="col-6">
          <label class="form-label small fw-semibold">Ville arrivée</label>
          <input id="edit-villeArrivee" class="form-control" required />
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Prix transport (FCFA)</label>
          <input id="edit-prixTransport" type="number" class="form-control" min="0" placeholder="Optionnel" />
        </div>
        <div class="col-12">
          <label class="form-label small fw-semibold">Commentaire</label>
          <textarea id="edit-commentaire" class="form-control" rows="2" placeholder="Optionnel"></textarea>
        </div>
      </div>
      <div id="edit-error" class="alert alert-danger mt-3 d-none"></div>
      <div class="d-flex gap-2 justify-content-end mt-4">
        <button type="button" class="btn btn-outline-secondary" onclick="closeEdit()">Annuler</button>
        <button type="submit" class="btn btn-primary" id="btn-edit-save">
          <i class="align-middle me-1" data-feather="save" style="width:14px"></i> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/app-elimmeka.js"></script>
<script>
let allShipments = [];
let role = '';
let currentUserId = '';
let filterPanelOpen = true;

// ─── Sidebar ───────────────────────────────────────────────────────────────────
function buildSidebar(r) {
  const brand = document.getElementById('sidebar-brand');
  const nav   = document.getElementById('sidebar-nav');
  const back  = document.getElementById('btn-back');
  if (r === 'TRANSPORTER') {
    brand.href = 'transporteur-dashboard.html';
    back.href  = 'transporteur-dashboard.html';
    nav.innerHTML = `
      <li class="sidebar-header">Portail Transporteur</li>
      <li class="sidebar-item"><a class="sidebar-link" href="transporteur-dashboard.html"><i class="align-middle" data-feather="home"></i> <span class="align-middle">Dashboard</span></a></li>
      <li class="sidebar-item"><a class="sidebar-link" href="transporteur-missions.html"><i class="align-middle" data-feather="clipboard"></i> <span class="align-middle">Missions</span></a></li>
      <li class="sidebar-item"><a class="sidebar-link" href="transporteur-flotte.html"><i class="align-middle" data-feather="truck"></i> <span class="align-middle">Ma Flotte</span></a></li>
      <li class="sidebar-item"><a class="sidebar-link" href="transporteur-chauffeurs.html"><i class="align-middle" data-feather="users"></i> <span class="align-middle">Mes Chauffeurs</span></a></li>
      <li class="sidebar-item active"><a class="sidebar-link" href="expeditions-disponibles.html"><i class="align-middle" data-feather="package"></i> <span class="align-middle">Expéditions dispo.</span></a></li>
    `;
  } else {
    brand.href = 'expediteur-dashboard.html';
    back.href  = 'expediteur-dashboard.html';
    nav.innerHTML = `
      <li class="sidebar-header">Portail Expéditeur</li>
      <li class="sidebar-item"><a class="sidebar-link" href="expediteur-dashboard.html"><i class="align-middle" data-feather="home"></i> <span class="align-middle">Tableau de bord</span></a></li>
      <li class="sidebar-item"><a class="sidebar-link" href="expediteur-expeditions.html"><i class="align-middle" data-feather="package"></i> <span class="align-middle">Mes Expéditions</span></a></li>
      <li class="sidebar-item"><a class="sidebar-link" href="expediteur-nouvelle-expedition.html"><i class="align-middle" data-feather="plus-circle"></i> <span class="align-middle">Nouvelle expédition</span></a></li>
      <li class="sidebar-item active"><a class="sidebar-link" href="expeditions-disponibles.html"><i class="align-middle" data-feather="list"></i> <span class="align-middle">Expéditions dispo.</span></a></li>
    `;
  }
}

// ─── Filtres ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const marchandise  = document.getElementById('f-marchandise').value.trim().toLowerCase();
  const paysDepart   = document.getElementById('f-pays-depart').value;
  const paysArrivee  = document.getElementById('f-pays-arrivee').value;
  const villeDepart  = document.getElementById('f-ville-depart').value.trim().toLowerCase();
  const villeArrivee = document.getElementById('f-ville-arrivee').value.trim().toLowerCase();
  const poidsMin     = document.getElementById('f-poids-min').value ? Number(document.getElementById('f-poids-min').value) : null;
  const poidsMax     = document.getElementById('f-poids-max').value ? Number(document.getElementById('f-poids-max').value) : null;
  const prixMin      = document.getElementById('f-prix-min').value  ? Number(document.getElementById('f-prix-min').value)  : null;
  const prixMax      = document.getElementById('f-prix-max').value  ? Number(document.getElementById('f-prix-max').value)  : null;
  const dateDebut    = document.getElementById('f-date-debut').value;
  const dateFin      = document.getElementById('f-date-fin').value;

  const filtered = allShipments.filter(s => {
    if (marchandise  && !s.marchandise.toLowerCase().includes(marchandise)) return false;
    if (paysDepart   && s.paysDepart  !== paysDepart)  return false;
    if (paysArrivee  && s.paysArrivee !== paysArrivee) return false;
    if (villeDepart  && !s.villeDepart.toLowerCase().includes(villeDepart))   return false;
    if (villeArrivee && !s.villeArrivee.toLowerCase().includes(villeArrivee)) return false;
    if (poidsMin !== null && s.poids < poidsMin) return false;
    if (poidsMax !== null && s.poids > poidsMax) return false;
    if (prixMin  !== null && (s.prixTransport ?? 0) < prixMin) return false;
    if (prixMax  !== null && (s.prixTransport ?? 0) > prixMax) return false;
    if (dateDebut && s.dateAnnonce < dateDebut) return false;
    if (dateFin   && s.dateAnnonce > dateFin)   return false;
    return true;
  });

  renderCards(filtered);

  const activeCount = [marchandise, paysDepart, paysArrivee, villeDepart, villeArrivee,
    dateDebut, dateFin,
    poidsMin !== null ? '1' : '', poidsMax !== null ? '1' : '',
    prixMin  !== null ? '1' : '', prixMax  !== null ? '1' : '',
  ].filter(Boolean).length;

  const badge = document.getElementById('filter-badge');
  if (activeCount > 0) { badge.textContent = activeCount; badge.classList.remove('d-none'); }
  else { badge.classList.add('d-none'); }

  document.getElementById('filter-result-count').textContent =
    `${filtered.length} annonce${filtered.length !== 1 ? 's' : ''} sur ${allShipments.length}`;
}

function resetFilters() {
  ['f-pays-depart','f-pays-arrivee'].forEach(id => document.getElementById(id).value = '');
  ['f-marchandise','f-ville-depart','f-ville-arrivee',
   'f-poids-min','f-poids-max','f-prix-min','f-prix-max',
   'f-date-debut','f-date-fin'].forEach(id => document.getElementById(id).value = '');
  applyFilters();
}

function toggleFilters() {
  filterPanelOpen = !filterPanelOpen;
  document.getElementById('filter-panel').style.display = filterPanelOpen ? '' : 'none';
  document.getElementById('filter-chevron').style.transform = filterPanelOpen ? '' : 'rotate(-90deg)';
}

// ─── Cartes ────────────────────────────────────────────────────────────────────
function renderCards(list) {
  const container = document.getElementById('cards-container');
  if (list.length === 0) {
    container.innerHTML = `<div class="col-12 text-center py-5"><div style="font-size:3rem;margin-bottom:12px">📦</div><h5 class="text-muted">Aucune expédition trouvée</h5><p class="text-muted small">Essayez de modifier vos filtres.</p></div>`;
    return;
  }
  container.innerHTML = list.map((s, i) => {
    const isUrgent = s.commentaireGeneral?.toLowerCase().includes('urgent') || false;
    const isNew = i < 2; // first 2 are "new" visually — approximation
    const age = (() => {
      if (!s.createdAt && !s.dateAnnonce) return '';
      const diff = Date.now() - new Date(s.createdAt ?? s.dateAnnonce).getTime();
      const h = Math.floor(diff / 3600000);
      if (h < 1) return 'Il y a quelques min';
      if (h < 24) return `Il y a ${h}h`;
      return `Il y a ${Math.floor(h/24)}j`;
    })();
    return `
    <div class="col-md-6">
      <div class="cu-mission-card h-100 ${isUrgent ? 'urgent' : ''}">
        ${isUrgent ? '<span class="cu-mission-badge urgent">⚡ Urgent</span>' : (isNew ? '<span class="cu-mission-badge new">Nouveau</span>' : '')}
        <div class="fw-bold" style="font-size:.8rem;color:#6B7280;margin-bottom:2px">${s.marchandise?.split(' ')[0]?.toUpperCase() ?? 'EXPÉDITION'}</div>
        <div class="text-muted" style="font-size:.72rem;margin-bottom:10px">${age}</div>

        <div class="cu-route">
          <div class="cu-route-dot"></div>
          <div class="cu-route-city">${s.villeDepart ?? '—'}</div>
          <div class="cu-route-line"></div>
          <div class="cu-route-city">${s.villeArrivee ?? '—'}</div>
          <div class="cu-route-dot dest"></div>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <span class="cu-chip">${s.marchandise ?? '—'} ${s.poids ?? ''}T</span>
          ${s.emballage ? `<span class="cu-chip">${s.emballage}</span>` : ''}
          ${s.paysDepart && s.paysDepart !== s.paysArrivee ? `<span class="cu-chip">🌍 ${s.paysDepart} → ${s.paysArrivee}</span>` : `<span class="cu-chip">🏙 ${s.villeDepart} → ${s.villeArrivee}</span>`}
          <span class="cu-chip">📅 ${UI.formatDate(s.dateAnnonce)}</span>
        </div>

        <div class="d-flex justify-content-between align-items-end">
          <div>
            <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9CA3AF;margin-bottom:2px">Rémunération</div>
            <div class="cu-price">${s.prixTransport ? s.prixTransport.toLocaleString('fr-FR') + ' FCFA' : '—'}</div>
          </div>
          <div class="d-flex gap-2">
            ${role === 'TRANSPORTER' ? (() => {
              const alreadyInterested = s.interests?.some(i => i.transporterId === currentUserId);
              return `
              <button class="btn btn-sm btn-outline-secondary" onclick="openDetail('${s.id}')">Détails</button>
              ${alreadyInterested
                ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelInterest('${s.id}', this)">
                     <i class="align-middle me-1" data-feather="x-circle" style="width:13px"></i>Annuler mon intérêt
                   </button>`
                : `<a class="btn btn-sm btn-primary" href="transporteur-accepter.html?missionId=${s.id}&mode=interest">
                     Je suis intéressé
                   </a>`
              }`;
            })() : role === 'EXPEDITEUR' && s.companyId === currentUserId ? `
              <button class="btn btn-sm btn-outline-primary" onclick="openEdit('${s.id}')"><i data-feather="edit-2" class="align-middle me-1" style="width:13px"></i>Modifier</button>
            ` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  if (typeof feather !== 'undefined') feather.replace();
}

// ─── Annuler intérêt ───────────────────────────────────────────────────────────
async function cancelInterest(id, btn) {
  UI.loading(btn, true);
  try {
    await api.delete(`/shipments/${id}/interest`);
    UI.toast('Intérêt annulé.', 'info');
    const res = await api.get('/shipments');
    const all = Array.isArray(res) ? res : (res?.data ?? []);
    allShipments = all.filter(s => s.statut === 'PENDING');
    applyFilters();
  } catch (err) {
    UI.toast(err.error ?? err.message ?? 'Erreur', 'danger');
    UI.loading(btn, false);
  }
}

// ─── Intérêt ───────────────────────────────────────────────────────────────────
async function expressInterest(id, btn) {
  UI.loading(btn, true);
  try {
    await api.post(`/shipments/${id}/interest`, {});
    UI.toast('Intérêt enregistré ! L\'équipe Elimmekatruck va examiner votre candidature.', 'success');
    btn.disabled = true;
    btn.innerHTML = '<i data-feather="check" style="width:13px"></i> Intérêt envoyé';
    btn.classList.replace('btn-success', 'btn-secondary');
    if (typeof feather !== 'undefined') feather.replace();
  } catch (err) {
    const msg = err.error ?? err.message ?? 'Erreur';
    if (msg.includes('déjà')) {
      UI.toast('Vous avez déjà manifesté votre intérêt pour cette expédition.', 'warning');
      btn.disabled = true;
      btn.innerHTML = '<i data-feather="check" style="width:13px"></i> Intérêt envoyé';
      btn.classList.replace('btn-success', 'btn-secondary');
    } else {
      UI.toast(msg, 'danger');
      UI.loading(btn, false);
    }
    if (typeof feather !== 'undefined') feather.replace();
  }
}

// ─── Overlay détail ────────────────────────────────────────────────────────────
function openDetail(id) {
  const s = allShipments.find(x => x.id === id);
  if (!s) return;
  document.getElementById('detail-content').innerHTML = `
    <table class="table table-sm mb-0">
      <tr><td class="text-muted" style="width:40%">Référence</td><td><strong>#${s.id.slice(0,8).toUpperCase()}</strong></td></tr>
      <tr><td class="text-muted">Départ</td><td>${s.paysDepart ?? '—'} / ${s.villeDepart}</td></tr>
      <tr><td class="text-muted">Arrivée</td><td>${s.paysArrivee ?? '—'} / ${s.villeArrivee}</td></tr>
      <tr><td class="text-muted">Marchandise</td><td>${s.marchandise}</td></tr>
      <tr><td class="text-muted">Poids</td><td>${s.poids} T</td></tr>
      ${s.emballage ? `<tr><td class="text-muted">Emballage</td><td>${s.emballage}</td></tr>` : ''}
      ${s.quantite  ? `<tr><td class="text-muted">Quantité</td><td>${s.quantite}</td></tr>` : ''}
      ${s.prixTransport ? `<tr><td class="text-muted">Prix proposé</td><td class="fw-semibold text-success">${s.prixTransport.toLocaleString('fr-FR')} FCFA</td></tr>` : ''}
      <tr><td class="text-muted">Date annonce</td><td>${UI.formatDate(s.dateAnnonce)} à ${s.heureAnnonce ?? '—'}</td></tr>
      ${s.commentaireGeneral ? `<tr><td class="text-muted">Commentaire</td><td class="fst-italic">"${s.commentaireGeneral}"</td></tr>` : ''}
    </table>
  `;
  document.getElementById('btn-interested').onclick = () => {
    window.location.href = `transporteur-accepter.html?missionId=${id}&mode=interest`;
  };
  document.getElementById('detail-overlay').style.display = 'flex';
  if (typeof feather !== 'undefined') feather.replace();
}

function closeDetail() { document.getElementById('detail-overlay').style.display = 'none'; }

// ─── Overlay modification (EXPEDITEUR) ────────────────────────────────────────
let editShipmentId = null;

function openEdit(id) {
  const s = allShipments.find(x => x.id === id);
  if (!s) return;
  editShipmentId = id;
  document.getElementById('edit-marchandise').value   = s.marchandise ?? '';
  document.getElementById('edit-poids').value         = s.poids ?? '';
  document.getElementById('edit-quantite').value      = s.quantite ?? '';
  document.getElementById('edit-villeDepart').value   = s.villeDepart ?? '';
  document.getElementById('edit-villeArrivee').value  = s.villeArrivee ?? '';
  document.getElementById('edit-prixTransport').value = s.prixTransport ?? '';
  document.getElementById('edit-commentaire').value   = s.commentaireGeneral ?? '';
  document.getElementById('edit-error').classList.add('d-none');
  document.getElementById('edit-overlay').style.display = 'flex';
  if (typeof feather !== 'undefined') feather.replace();
}

function closeEdit() {
  document.getElementById('edit-overlay').style.display = 'none';
  editShipmentId = null;
}

document.getElementById('edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!editShipmentId) return;
  const btn = document.getElementById('btn-edit-save');
  btn.disabled = true;
  const errEl = document.getElementById('edit-error');
  errEl.classList.add('d-none');
  const payload = {
    marchandise:        document.getElementById('edit-marchandise').value.trim(),
    poids:              Number(document.getElementById('edit-poids').value),
    villeDepart:        document.getElementById('edit-villeDepart').value.trim(),
    villeArrivee:       document.getElementById('edit-villeArrivee').value.trim(),
  };
  const quantite = Number(document.getElementById('edit-quantite').value);
  if (quantite > 0) payload.quantite = quantite;
  const prix = Number(document.getElementById('edit-prixTransport').value);
  if (prix > 0) payload.prixTransport = prix;
  const commentaire = document.getElementById('edit-commentaire').value.trim();
  if (commentaire) payload.commentaireGeneral = commentaire;
  try {
    await api.put(`/shipments/${editShipmentId}`, payload);
    UI.toast('Expédition modifiée avec succès !', 'success');
    closeEdit();
    // Recharger les données
    const res = await api.get('/shipments');
    const raw = Array.isArray(res) ? res : (res?.data ?? []);
    allShipments = raw.filter(s => s.statut === 'PENDING');
    applyFilters();
  } catch (err) {
    errEl.textContent = err?.response?.data?.error ?? 'Erreur lors de la modification.';
    errEl.classList.remove('d-none');
  } finally {
    btn.disabled = false;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetail(); closeEdit(); } });

// ─── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;
  UI.fillNavbar();

  const user = Auth.getUser();
  role = user?.role ?? '';
  currentUserId = user?.sub ?? user?.id ?? '';
  buildSidebar(role);
  await loadGeo(); fillCountrySelects(true);

  document.getElementById('page-subtitle').textContent =
    role === 'TRANSPORTER'
      ? 'Toutes les expéditions en attente d\'un transporteur'
      : 'Toutes vos expéditions';

  try {
    const res = await api.get('/shipments');
    const all = Array.isArray(res) ? res : (res?.data ?? []);
    allShipments = all.filter(s => s.statut === 'PENDING');
    applyFilters();
  } catch (err) {
    document.getElementById('alert-container').innerHTML =
      `<div class="alert alert-danger">Erreur : ${err.error ?? err.message ?? 'Erreur inconnue'}</div>`;
  }
});
</script>
</body>
</html>
