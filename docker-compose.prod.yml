# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml
# Override de production — utiliser avec :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  # ─── Reverse proxy Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway-1
      - api-gateway-2
    healthcheck:
      test: nginx -t || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Certbot — renouvellement automatique Let's Encrypt ──────────────────
  # Premier certificat : docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d VOTRE_DOMAINE --email VOTRE_EMAIL --agree-tos
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renouvellement automatique toutes les 12h (certificats valides 90 jours)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # ─── 2 instances du API Gateway (load balancing) ─────────────────────────
  api-gateway-1:
    build:
      context: ./api-gateway
    container_name: api-gateway-1
    restart: unless-stopped
    # Pas de ports exposés vers l'hôte — tout passe par Nginx
    expose:
      - "3006"
    environment:
      PORT: 3006
      NODE_ENV: production
      SERVICE_NAME: api-gateway-1
      INSTANCE_ID: "1"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3001
      SHIPMENT_SERVICE_URL: http://shipment-service:3002
      FLEET_SERVICE_URL: http://fleet-service:3003
      TRACKING_SERVICE_URL: http://tracking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway-2:
    build:
      context: ./api-gateway
    container_name: api-gateway-2
    restart: unless-stopped
    expose:
      - "3006"
    environment:
      PORT: 3006
      NODE_ENV: production
      SERVICE_NAME: api-gateway-2
      INSTANCE_ID: "2"
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3001
      SHIPMENT_SERVICE_URL: http://shipment-service:3002
      FLEET_SERVICE_URL: http://fleet-service:3003
      TRACKING_SERVICE_URL: http://tracking-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3006/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Microservices : plus de ports exposés vers l'hôte en prod ───────────
  # Seul Nginx a accès au réseau externe. Les services communiquent
  # entre eux via le réseau Docker interne uniquement.
  auth-service:
    ports: []
    expose:
      - "3000"

  company-service:
    ports: []
    expose:
      - "3001"

  fleet-service:
    ports: []
    expose:
      - "3003"

  shipment-service:
    ports: []
    expose:
      - "3002"

  tracking-service:
    ports: []
    expose:
      - "3004"
      - "3007"

  notification-service:
    ports: []
    expose:
      - "3005"

  # Jaeger UI accessible uniquement en local (SSH tunnel pour accès distant)
  jaeger:
    ports:
      - "127.0.0.1:16686:16686"

  mongodb:
    ports: []  # MongoDB non exposé vers l'extérieur en prod

volumes:
  nginx_logs:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local
